
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared SMS System</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: #1e293b;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,.35);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #cbd5e1;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 18px;
            border: 1px solid #475569;
            border-radius: 9px;
            background: #0f172a;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #0284c7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0369a1;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

        .error {
            color: #f87171;
        }

        .success {
            color: #4ade80;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">📱</div>

    <h1>Shared SMS System</h1>

    <div class="subtitle">
        Secure SMS Dashboard
    </div>

    <form id="loginForm">

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit" id="loginButton">
            LOGIN
        </button>

    </form>

    <div id="message"></div>

</div>

<script>

    // ============================================
    // SUPABASE CONFIGURATION
    // ============================================

    const SUPABASE_URL = "https://ljenkggaiiquttrmxilp.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxqZW5rZ2dhaWlxdXR0cm14aWxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzUzNTUsImV4cCI6MjEwNDUxMTM1NX0.YJtrQ5J8pNb-6at9xVUHfoF7dgGprCZ7F3R4Q49X1Ik";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // ============================================
    // LOGIN
    // ============================================

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        message.textContent = "";
        message.className = "";

        loginButton.disabled = true;
        loginButton.textContent = "LOGGING IN...";

        try {

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) {
                throw error;
            }

            if (!data.user) {
                throw new Error("Login failed.");
            }

            message.textContent = "Login successful!";
            message.className = "success";

            // Temporary:
            // Next step natin dito ang actual Dashboard.
            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 700);

        } catch (error) {

            console.error(error);

            message.textContent =
                error.message || "Login failed.";

            message.className = "error";

            loginButton.disabled = false;
            loginButton.textContent = "LOGIN";
        }

    });

</script>

</body>
</html>
